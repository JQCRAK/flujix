# Configuración Nginx para Flujix (reverse proxy)
# Ubicación sugerida: /etc/nginx/sites-available/flujix.conf
#   sudo ln -s /etc/nginx/sites-available/flujix.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name flujix.local localhost;

    # Frontend: archivos estáticos del build de Vite
    root /var/www/flujix/frontend/dist;
    index index.html;

    location / {
        # SPA: cualquier ruta desconocida regresa al index.html
        try_files $uri $uri/ /index.html;
    }

    # API: reverse proxy hacia el backend Node (producción, puerto 3000)
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache para assets con hash en el nombre
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
